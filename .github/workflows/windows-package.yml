name: Windows Package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build and validate Windows package
        shell: pwsh
        run: .\scripts\package_windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: embedded-flash-assistant-windows-${{ github.run_number }}
          path: artifacts/embedded-flash-assistant-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
